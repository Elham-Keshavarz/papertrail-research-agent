[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrail-research-agent"
version = "1.6.2"
description = "Evidence-first scientific-paper research agent with local RAG, optional LLM synthesis and Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "PaperTrail contributors"}]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
  "defusedxml>=0.7,<1",
  "pymupdf>=1.24,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
embeddings = ["sentence-transformers>=3.3,<6"]
search = ["faiss-cpu>=1.12,<2"]
agent = ["langgraph>=1.2,<2"]
ui = ["streamlit>=1.67,<2"]

[project.scripts]
papertrail = "papertrail.cli_bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -ra"
testpaths = ["tests"]
pythonpath = ["src"]
