name: Python tests and release safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Release structure and secret-pattern check
        run: python tools/check_release.py
      - name: Install project and optional integrations
        run: python -m pip install -e '.[dev,search,agent,ui]'
      - name: Run offline tests
        run: python -m pytest
      - name: Doctor (local capability smoke test)
        run: python -m papertrail doctor
